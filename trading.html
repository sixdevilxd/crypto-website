<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NexCrypto Trading — BTC/USDT</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{background:#0a0e1a;color:#e0e6f0;overflow-x:hidden;min-height:100vh}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:#0a0e1a}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#3b82f6,#8b5cf6);border-radius:4px}

.topbar{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:.8rem 2%;background:rgba(10,14,26,.85);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.05);flex-wrap:wrap;gap:1rem}
.logo{font-size:1.3rem;font-weight:800;background:linear-gradient(135deg,#3b82f6,#8b5cf6,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-decoration:none}
.pairs{display:flex;gap:.3rem;align-items:center;flex-wrap:wrap}
.pair-btn{background:transparent;border:1px solid rgba(255,255,255,.1);color:#94a3b8;padding:.4rem .8rem;border-radius:8px;cursor:pointer;font-size:.85rem;font-weight:600;transition:all .2s}
.pair-btn.active{background:rgba(59,130,246,.15);border-color:#3b82f6;color:#3b82f6}
.pair-btn:hover{border-color:rgba(59,130,246,.5)}
.ticker-info{display:flex;align-items:center;gap:1rem;font-size:.9rem}
.ticker-price{font-size:1.1rem;font-weight:700;color:#e0e6f0}
.ticker-change{font-size:.85rem;font-weight:600;padding:.2rem .6rem;border-radius:6px}
.up{color:#10b981;background:rgba(16,185,129,.1)}
.down{color:#ef4444;background:rgba(239,68,68,.1)}
.nav-right{display:flex;align-items:center;gap:.5rem}
.connect-btn{background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff;border:none;padding:.5rem 1.2rem;border-radius:50px;font-weight:600;cursor:pointer;font-size:.85rem;transition:all .3s;box-shadow:0 4px 15px rgba(59,130,246,.3)}
.wallet-connected{display:flex;align-items:center;gap:.4rem;background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);padding:.4rem .8rem;border-radius:50px;color:#10b981;font-size:.8rem;font-weight:600;cursor:pointer;position:relative}
.wallet-connected .dot{width:6px;height:6px;background:#10b981;border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.wallet-dropdown{position:absolute;top:calc(100% + 8px);right:0;background:#131a2b;border:1px solid rgba(255,255,255,.1);border-radius:12px;min-width:200px;padding:.4rem;box-shadow:0 10px 30px rgba(0,0,0,.5);display:none;z-index:200}
.wallet-dropdown.active{display:block}
.wallet-dropdown .dd-item{padding:.6rem .8rem;border-radius:8px;cursor:pointer;font-size:.8rem;color:#cbd5e1;display:flex;align-items:center;gap:.5rem}
.wallet-dropdown .dd-item:hover{background:rgba(59,130,246,.1);color:#3b82f6}
.wallet-dropdown .dd-divider{height:1px;background:rgba(255,255,255,.05);margin:.3rem 0}
.back-home{color:#94a3b8;text-decoration:none;font-size:.85rem;display:flex;align-items:center;gap:.3rem;padding:.4rem .8rem;border-radius:8px;transition:all .2s}
.back-home:hover{background:rgba(255,255,255,.05);color:#3b82f6}

.layout{display:grid;grid-template-columns:1fr 320px;gap:1rem;padding:1rem;height:calc(100vh - 60px)}
@media(max-width:1024px){.layout{grid-template-columns:1fr;height:auto}}

.chart-section{display:flex;flex-direction:column;gap:1rem;min-width:0}
.chart-box{background:rgba(19,26,43,.4);border:1px solid rgba(255,255,255,.05);border-radius:12px;padding:1rem;flex:1;min-height:400px;position:relative}
.chart-controls{display:flex;gap:.3rem;margin-bottom:.5rem;flex-wrap:wrap}
.tf-btn{background:transparent;border:1px solid rgba(255,255,255,.05);color:#94a3b8;padding:.3rem .7rem;border-radius:6px;cursor:pointer;font-size:.75rem;font-weight:600;transition:all .2s}
.tf-btn.active{background:rgba(59,130,246,.15);border-color:#3b82f6;color:#3b82f6}
#chart{width:100%;height:calc(100% - 40px);min-height:350px}

.orderbook{background:rgba(19,26,43,.4);border:1px solid rgba(255,255,255,.05);border-radius:12px;padding:1rem;height:fit-content;max-height:400px;display:flex;flex-direction:column}
.ob-title{font-size:.85rem;font-weight:700;color:#94a3b8;margin-bottom:.5rem;text-transform:uppercase;letter-spacing:.5px}
.ob-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.3rem;padding:.25rem .3rem;font-size:.75rem;align-items:center;position:relative}
.ob-row .bar-bg{position:absolute;right:0;top:0;bottom:0;background:rgba(239,68,68,.1);z-index:0;border-radius:2px}
.ob-row.buy .bar-bg{background:rgba(16,185,129,.1)}
.ob-row>*{position:relative;z-index:1}
.ob-spread{text-align:center;padding:.4rem;font-weight:700;color:#3b82f6;font-size:.85rem;border-top:1px solid rgba(255,255,255,.05);border-bottom:1px solid rgba(255,255,255,.05);margin:.3rem 0}
.ob-price{font-weight:600}
.ob-row.sell .ob-price{color:#ef4444}
.ob-row.buy .ob-price{color:#10b981}

.sidebar{display:flex;flex-direction:column;gap:1rem;min-width:0}
.trade-box{background:rgba(19,26,43,.4);border:1px solid rgba(255,255,255,.05);border-radius:12px;padding:1rem}
.trade-tabs{display:grid;grid-template-columns:1fr 1fr;gap:.3rem;margin-bottom:1rem;background:rgba(0,0,0,.2);padding:.3rem;border-radius:10px}
.trade-tab{background:transparent;border:none;color:#94a3b8;padding:.6rem;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s;font-size:.85rem}
.trade-tab.buy.active{background:rgba(16,185,129,.2);color:#10b981}
.trade-tab.sell.active{background:rgba(239,68,68,.2);color:#ef4444}
.trade-info{display:flex;justify-content:space-between;margin-bottom:.3rem;font-size:.8rem}
.trade-info .label{color:#94a3b8}
.trade-info .value{font-weight:600}
.trade-input{margin-bottom:.8rem}
.trade-input label{display:block;font-size:.75rem;color:#94a3b8;margin-bottom:.3rem}
.trade-input-inner{position:relative;display:flex;align-items:center}
.trade-input input{width:100%;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.1);color:#fff;padding:.6rem .8rem;border-radius:8px;font-size:.9rem;outline:none;transition:border .2s}
.trade-input input:focus{border-color:#3b82f6}
.trade-input .suffix{position:absolute;right:.8rem;color:#94a3b8;font-size:.8rem;font-weight:600;pointer-events:none}
.percent-row{display:grid;grid-template-columns:repeat(4,1fr);gap:.3rem;margin-bottom:1rem}
.percent-btn{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);color:#94a3b8;padding:.3rem;border-radius:6px;cursor:pointer;font-size:.7rem;font-weight:600;transition:all .2s}
.percent-btn:hover{background:rgba(59,130,246,.1);color:#3b82f6;border-color:rgba(59,130,246,.3)}
.execute-btn{width:100%;border:none;padding:.8rem;border-radius:10px;font-weight:700;font-size:.95rem;cursor:pointer;transition:all .3s;margin-top:.5rem}
.execute-btn.buy{background:linear-gradient(135deg,#10b981,#059669);color:#fff;box-shadow:0 4px 15px rgba(16,185,129,.3)}
.execute-btn.sell{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;box-shadow:0 4px 15px rgba(239,68,68,.3)}
.execute-btn:hover{transform:translateY(-1px);filter:brightness(1.1)}

.portfolio{background:rgba(19,26,43,.4);border:1px solid rgba(255,255,255,.05);border-radius:12px;padding:1rem}
.port-title{font-size:.85rem;font-weight:700;color:#94a3b8;margin-bottom:.8rem;text-transform:uppercase;letter-spacing:.5px;display:flex;justify-content:space-between;align-items:center}
.port-balance{background:linear-gradient(135deg,#3b82f6,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-size:1.3rem;font-weight:800}
.port-asset{display:flex;justify-content:space-between;align-items:center;padding:.5rem 0;border-bottom:1px solid rgba(255,255,255,.03);font-size:.85rem}
.port-asset:last-child{border-bottom:none}
.port-asset-name{color:#94a3b8}
.port-asset-val{font-weight:600}

.trades{background:rgba(19,26,43,.4);border:1px solid rgba(255,255,255,.05);border-radius:12px;padding:1rem;flex:1;min-height:200px;max-height:300px;overflow-y:auto}
.trade-row{display:grid;grid-template-columns:1fr 1fr 1fr;padding:.4rem 0;font-size:.8rem;border-bottom:1px solid rgba(255,255,255,.03)}
.trade-row:last-child{border-bottom:none}
.trade-row.buy-side .price{color:#10b981;font-weight:600}
.trade-row.sell-side .price{color:#ef4444;font-weight:600}
.trade-row .amount{color:#94a3b8;text-align:center}
.trade-row .time{color:#64748b;text-align:right;font-size:.7rem}

.toast{position:fixed;bottom:2rem;right:2rem;background:#131a2b;border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:1rem 1.5rem;box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;gap:.8rem;transform:translateY(150%);transition:transform .4s cubic-bezier(.4,0,.2,1);max-width:350px}
.toast.show{transform:translateY(0)}
.toast-icon{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.9rem;flex-shrink:0}
.toast.success .toast-icon{background:rgba(16,185,129,.2);color:#10b981}
.toast.error .toast-icon{background:rgba(239,68,68,.2);color:#ef4444}
.toast.info .toast-icon{background:rgba(59,130,246,.2);color:#3b82f6}
.toast-msg{font-size:.9rem;color:#e0e6f0}
</style>
</head>
<body>

<div class="topbar">
  <a href="index.html" class="logo">NexCrypto</a>
  <div class="pairs" id="pairs"></div>
  <div class="ticker-info">
    <div class="ticker-price" id="tPrice">$0</div>
    <div class="ticker-change up" id="tChange">+0.00%</div>
  </div>
  <div class="nav-right">
    <a href="index.html" class="back-home">← Home</a>
    <button id="connectBtn" class="connect-btn" onclick="connectWallet()">Connect Wallet</button>
    <div id="walletConnected" class="wallet-connected" style="display:none" onclick="toggleDropdown()">
      <span class="dot"></span>
      <span id="walletAddr">0x0000...0000</span>
      <div class="wallet-dropdown" id="walletDropdown">
        <div class="dd-item" onclick="event.stopPropagation();copyAddress()">📋 Copy Address</div>
        <div class="dd-divider"></div>
        <div class="dd-item" onclick="event.stopPropagation();disconnectWallet()" style="color:#ef4444">⏏️ Disconnect</div>
      </div>
    </div>
  </div>
</div>

<div class="layout">
  <div class="chart-section">
    <div class="chart-box">
      <div class="chart-controls">
        <button class="tf-btn" data-tf="1m">1m</button>
        <button class="tf-btn active" data-tf="5m">5m</button>
        <button class="tf-btn" data-tf="15m">15m</button>
        <button class="tf-btn" data-tf="1h">1h</button>
        <button class="tf-btn" data-tf="4h">4h</button>
        <button class="tf-btn" data-tf="1d">1d</button>
      </div>
      <div id="chart"></div>
    </div>
    <div class="orderbook">
      <div class="ob-title">Order Book</div>
      <div class="ob-row" style="color:#64748b;font-size:.7rem;text-transform:uppercase">
        <span>Price (USDT)</span><span style="text-align:center">Amount</span><span style="text-align:right">Total</span>
      </div>
      <div id="obSell"></div>
      <div class="ob-spread" id="obSpread">0.00</div>
      <div id="obBuy"></div>
    </div>
  </div>

  <div class="sidebar">
    <div class="trade-box">
      <div class="trade-tabs">
        <button class="trade-tab buy active" onclick="setSide('buy')">BUY</button>
        <button class="trade-tab sell" onclick="setSide('sell')">SELL</button>
      </div>
      <div class="trade-info"><span class="label">Available</span><span class="value" id="available">$10,000.00</span></div>
      <div class="trade-input">
        <label>Price</label>
        <div class="trade-input-inner">
          <input type="number" id="inpPrice" value="0" />
          <span class="suffix">USDT</span>
        </div>
      </div>
      <div class="trade-input">
        <label>Amount</label>
        <div class="trade-input-inner">
          <input type="number" id="inpAmount" placeholder="0.00" />
          <span class="suffix" id="amtSuffix">BTC</span>
        </div>
      </div>
      <div class="percent-row">
        <button class="percent-btn" onclick="setPercent(25)">25%</button>
        <button class="percent-btn" onclick="setPercent(50)">50%</button>
        <button class="percent-btn" onclick="setPercent(75)">75%</button>
        <button class="percent-btn" onclick="setPercent(100)">MAX</button>
      </div>
      <div class="trade-info"><span class="label">Total</span><span class="value" id="inpTotal">0.00 USDT</span></div>
      <button class="execute-btn buy" id="executeBtn" onclick="executeTrade()">Buy BTC</button>
    </div>

    <div class="portfolio">
      <div class="port-title">
        <span>Portfolio</span>
        <span class="port-balance" id="portBalance">$10,000.00</span>
      </div>
      <div id="portList"></div>
    </div>

    <div class="trades">
      <div class="port-title">Recent Trades</div>
      <div id="tradesList"></div>
    </div>
  </div>
</div>

<div id="toast" class="toast"><div class="toast-icon" id="toastIcon"></div><div class="toast-msg" id="toastMsg"></div></div>

<script>
let currentAccount = null, currentPair = 'BTC/USDT', currentSide = 'buy', currentPrice = 67423;
let chart, candleSeries, volumeSeries;
let portfolio = { USDT: 10000, BTC: 0, ETH: 0, BNB: 0, SOL: 0 };

const pairData = {
  'BTC/USDT': { base: 'BTC', quote: 'USDT', price: 67423, change: 2.4 },
  'ETH/USDT': { base: 'ETH', quote: 'USDT', price: 3521, change: 1.8 },
  'BNB/USDT': { base: 'BNB', quote: 'USDT', price: 612, change: -0.5 },
  'SOL/USDT': { base: 'SOL', quote: 'USDT', price: 178, change: 5.2 },
  'XRP/USDT': { base: 'XRP', quote: 'USDT', price: 0.52, change: -1.2 }
};

function init() {
  renderPairs();
  setPair('BTC/USDT');
  initChart();
  generateCandles();
  renderOrderBook();
  renderPortfolio();
  renderTrades();
  startLiveUpdate();
  setInterval(() => { updatePrices(); renderOrderBook(); renderPortfolio(); renderTrades(); updateChart(); }, 3000);
}

function renderPairs() {
  document.getElementById('pairs').innerHTML = Object.keys(pairData).map(p => 
    `<button class="pair-btn ${p === currentPair ? 'active' : ''}" onclick="setPair('${p}')">${p}</button>`
  ).join('');
}

function setPair(pair) {
  currentPair = pair;
  currentPrice = pairData[pair].price;
  document.getElementById('tPrice').textContent = '$' + currentPrice.toLocaleString(undefined, {maximumFractionDigits: pair.includes('XRP') ? 4 : 2});
  const ch = pairData[pair].change;
  const chEl = document.getElementById('tChange');
  chEl.textContent = (ch >= 0 ? '+' : '') + ch.toFixed(2) + '%';
  chEl.className = 'ticker-change ' + (ch >= 0 ? 'up' : 'down');
  document.getElementById('inpPrice').value = currentPrice.toFixed(pair.includes('XRP') ? 4 : 2);
  document.getElementById('amtSuffix').textContent = pairData[pair].base;
  document.querySelectorAll('.pair-btn').forEach(b => b.classList.toggle('active', b.textContent === pair));
  updateExecuteBtn();
  updateAvailable();
  if (chart) generateCandles();
}

function setSide(side) {
  currentSide = side;
  document.querySelectorAll('.trade-tab').forEach(t => t.classList.remove('active'));
  document.querySelector('.trade-tab.' + side).classList.add('active');
  updateExecuteBtn();
  updateAvailable();
}

function updateExecuteBtn() {
  const btn = document.getElementById('executeBtn');
  const base = pairData[currentPair].base;
  btn.className = 'execute-btn ' + currentSide;
  btn.textContent = (currentSide === 'buy' ? 'Buy ' : 'Sell ') + base;
}

function updateAvailable() {
  const base = pairData[currentPair].base, quote = pairData[currentPair].quote;
  const avail = currentSide === 'buy' ? portfolio.USDT : portfolio[base] || 0;
  document.getElementById('available').textContent = (currentSide === 'buy' ? '$' : '') + avail.toFixed(4) + (currentSide === 'buy' ? '' : ' ' + base);
}

function setPercent(p) {
  const base = pairData[currentPair].base;
  const price = parseFloat(document.getElementById('inpPrice').value) || currentPrice;
  if (currentSide === 'buy') {
    const max = portfolio.USDT / price;
    document.getElementById('inpAmount').value = (max * p / 100).toFixed(6);
  } else {
    const max = portfolio[base] || 0;
    document.getElementById('inpAmount').value = (max * p / 100).toFixed(6);
  }
  updateTotal();
}

function updateTotal() {
  const price = parseFloat(document.getElementById('inpPrice').value) || 0;
  const amount = parseFloat(document.getElementById('inpAmount').value) || 0;
  document.getElementById('inpTotal').textContent = (price * amount).toFixed(2) + ' USDT';
}

document.getElementById('inpAmount')?.addEventListener('input', updateTotal);
document.getElementById('inpPrice')?.addEventListener('input', updateTotal);

function executeTrade() {
  if (!currentAccount) { showToast('Connect wallet dulu! 🔐', 'error'); return; }
  const base = pairData[currentPair].base, quote = pairData[currentPair].quote;
  const price = parseFloat(document.getElementById('inpPrice').value) || 0;
  const amount = parseFloat(document.getElementById('inpAmount').value) || 0;
  if (amount <= 0) { showToast('Masukkan amount!', 'error'); return; }
  const total = price * amount;
  if (currentSide === 'buy' && total > portfolio.USDT) { showToast('Saldo USDT tidak cukup!', 'error'); return; }
  if (currentSide === 'sell' && amount > (portfolio[base] || 0)) { showToast(`Saldo ${base} tidak cukup!`, 'error'); return; }
  
  if (currentSide === 'buy') {
    portfolio.USDT -= total;
    portfolio[base] = (portfolio[base] || 0) + amount;
    showToast(`Bought ${amount.toFixed(6)} ${base} 🎉`, 'success');
  } else {
    portfolio.USDT += total;
    portfolio[base] = (portfolio[base] || 0) - amount;
    showToast(`Sold ${amount.toFixed(6)} ${base} 💰`, 'success');
  }
  document.getElementById('inpAmount').value = '';
  updateTotal();
  renderPortfolio();
  updateAvailable();
  renderTrades();
}

function initChart() {
  const container = document.getElementById('chart');
  chart = LightweightCharts.createChart(container, {
    layout: { background: { type: 'solid', color: 'transparent' }, textColor: '#94a3b8' },
    grid: { vertLines: { color: 'rgba(255,255,255,.03)' }, horzLines: { color: 'rgba(255,255,255,.03)' } },
    timeScale: { timeVisible: true, secondsVisible: false, borderColor: 'rgba(255,255,255,.05)' },
    rightPriceScale: { borderColor: 'rgba(255,255,255,.05)' },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal }
  });
  candleSeries = chart.addCandlestickSeries({ upColor: '#10b981', downColor: '#ef4444', borderVisible: false, wickUpColor: '#10b981', wickDownColor: '#ef4444' });
  
  document.querySelectorAll('.tf-btn').forEach(btn => btn.addEventListener('click', () => {
    document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    generateCandles();
  }));
  
  window.addEventListener('resize', () => chart.applyOptions({ width: container.clientWidth }));
}

function generateCandles() {
  if (!candleSeries) return;
  const data = [], volData = [];
  let price = currentPrice * 0.95;
  const now = Math.floor(Date.now() / 1000);
  for (let i = 200; i >= 0; i--) {
    const t = now - i * 300;
    const open = price;
    const close = open + (Math.random() - 0.48) * open * 0.01;
    const high = Math.max(open, close) + Math.random() * open * 0.005;
    const low = Math.min(open, close) - Math.random() * open * 0.005;
    data.push({ time: t, open, high, low, close });
    volData.push({ time: t, value: Math.random() * 100 + 20, color: close >= open ? 'rgba(16,185,129,.5)' : 'rgba(239,68,68,.5)' });
    price = close;
  }
  currentPrice = price;
  candleSeries.setData(data);
  chart.timeScale().fitContent();
}

function updateChart() {
  if (!candleSeries) return;
  const lastTime = Math.floor(Date.now() / 1000);
  const last = candleSeries.dataByIndex(candleSeries.data().length - 1, LightweightCharts.PriceScaleMode.Normal);
  if (last) {
    const close = last.close + (Math.random() - 0.48) * last.close * 0.002;
    candleSeries.update({ time: lastTime, open: last.close, high: Math.max(last.close, close), low: Math.min(last.close, close), close });
  }
}

function renderOrderBook() {
  const base = pairData[currentPair].price;
  const sell = [], buy = [];
  for (let i = 5; i >= 1; i--) sell.push({ p: base + i * (base * 0.0005), a: Math.random() * 2 });
  for (let i = 1; i <= 5; i++) buy.push({ p: base - i * (base * 0.0005), a: Math.random() * 2 });
  
  document.getElementById('obSell').innerHTML = sell.map(o => {
    const total = o.p * o.a;
    return `<div class="ob-row sell"><div class="bar-bg" style="width:${(o.a/2)*100}%"></div><span class="ob-price">${o.p.toFixed(2)}</span><span>${o.a.toFixed(4)}</span><span style="text-align:right">${total.toFixed(2)}</span></div>`;
  }).join('');
  
  document.getElementById('obBuy').innerHTML = buy.map(o => {
    const total = o.p * o.a;
    return `<div class="ob-row buy"><div class="bar-bg" style="width:${(o.a/2)*100}%"></div><span class="ob-price">${o.p.toFixed(2)}</span><span>${o.a.toFixed(4)}</span><span style="text-align:right">${total.toFixed(2)}</span></div>`;
  }).join('');
  
  document.getElementById('obSpread').textContent = (sell[4].p - buy[0].p).toFixed(2) + ' USDT';
}

function renderPortfolio() {
  const total = portfolio.USDT + (portfolio.BTC || 0) * pairData['BTC/USDT'].price + (portfolio.ETH || 0) * pairData['ETH/USDT'].price + (portfolio.BNB || 0) * pairData['BNB/USDT'].price + (portfolio.SOL || 0) * pairData['SOL/USDT'].price;
  document.getElementById('portBalance').textContent = '$' + total.toFixed(2);
  document.getElementById('portList').innerHTML = Object.entries(portfolio).filter(([k]) => k !== 'USDT' || portfolio.USDT > 0).map(([k, v]) => {
    if (v === 0) return '';
    return `<div class="port-asset"><span class="port-asset-name">${k}</span><span class="port-asset-val">${v.toFixed(6)}</span></div>`;
  }).join('');
}

let tradeHistory = [];
function renderTrades() {
  if (tradeHistory.length < 8) {
    for (let i = 0; i < 8; i++) {
      const side = Math.random() > 0.5 ? 'buy' : 'sell';
      tradeHistory.push({
        side, price: pairData[currentPair].price * (1 + (Math.random() - 0.5) * 0.001),
        amount: Math.random() * 0.5, time: new Date(Date.now() - i * 60000)
      });
    }
  }
  document.getElementById('tradesList').innerHTML = tradeHistory.slice(0, 10).map(t => {
    const time = t.time.toTimeString().slice(0, 8);
    return `<div class="trade-row ${t.side}-side"><span class="price">${t.price.toFixed(2)}</span><span class="amount">${t.amount.toFixed(4)}</span><span class="time">${time}</span></div>`;
  }).join('');
}

function updatePrices() {
  Object.keys(pairData).forEach(p => {
    pairData[p].price *= 1 + (Math.random() - 0.48) * 0.002;
    pairData[p].change += (Math.random() - 0.5) * 0.05;
  });
  if (currentPair === 'BTC/USDT' || (Math.random() > 0.7)) {
    setPair(currentPair);
  }
}

let priceInterval;
function startLiveUpdate() {
  if (priceInterval) clearInterval(priceInterval);
  priceInterval = setInterval(() => {
    pairData[currentPair].price *= 1 + (Math.random() - 0.48) * 0.001;
    currentPrice = pairData[currentPair].price;
    document.getElementById('tPrice').textContent = '$' + currentPrice.toLocaleString(undefined, {maximumFractionDigits: currentPair.includes('XRP') ? 4 : 2});
    const ch = pairData[currentPair].change;
    const chEl = document.getElementById('tChange');
    chEl.textContent = (ch >= 0 ? '+' : '') + ch.toFixed(2) + '%';
    chEl.className = 'ticker-change ' + (ch >= 0 ? 'up' : 'down');
  }, 1500);
}

async function connectWallet() {
  if (typeof window.ethereum === 'undefined') { showToast('Install MetaMask dulu! metamask.io', 'error'); setTimeout(() => window.open('https://metamask.io/download/'), 1500); return; }
  try {
    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
    currentAccount = accounts[0];
    document.getElementById('connectBtn').style.display = 'none';
    document.getElementById('walletConnected').style.display = 'flex';
    document.getElementById('walletAddr').textContent = currentAccount.slice(0,6) + '...' + currentAccount.slice(-4);
    showToast('Wallet connected! 🎉', 'success');
    updateAvailable();
  } catch (e) { showToast('Gagal konek', 'error'); }
}

function toggleDropdown() { document.getElementById('walletDropdown').classList.toggle('active'); }
function copyAddress() { navigator.clipboard.writeText(currentAccount); showToast('Address copied!', 'success'); document.getElementById('walletDropdown').classList.remove('active'); }
function disconnectWallet() { currentAccount = null; document.getElementById('connectBtn').style.display = 'block'; document.getElementById('walletConnected').style.display = 'none'; showToast('Disconnected', 'info'); document.getElementById('walletDropdown').classList.remove('active'); updateAvailable(); }
document.addEventListener('click', e => { if (!e.target.closest('.wallet-connected')) document.getElementById('walletDropdown')?.classList.remove('active'); });
if (window.ethereum) { window.ethereum.on('accountsChanged', a => { if (!a.length) disconnectWallet(); else { currentAccount = a[0]; document.getElementById('walletAddr').textContent = currentAccount.slice(0,6) + '...' + currentAccount.slice(-4); } }); window.ethereum.on('chainChanged', () => location.reload()); }

function showToast(msg, type = 'info') {
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  const icons = { success: '✓', error: '✕', info: 'ℹ' };
  document.getElementById('toastIcon').innerHTML = icons[type] || icons.info;
  t.className = 'toast show ' + type;
  setTimeout(() => t.classList.remove('show'), 3500);
}

window.addEventListener('load', init);
</script>
</body>
</html>
